<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8f9"/>
      <stop offset="100%" stop-color="#e9f3f4"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d3a42"/>
      <stop offset="100%" stop-color="#1c6e78"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="20"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#badfe3" stroke-width="2" rx="19"/>

  <!-- Top Badge -->
  <rect x="40" y="32" width="220" height="30" rx="15" fill="#1c6e78"/>
  <text x="150" y="52" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    체성 신경 및 호흡 제어
  </text>
  <text x="760" y="52" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#666666">
    해아림한의원 자율신경 클리닉 FAQ
  </text>

  <!-- Title and Subtitle -->
  <text x="40" y="98" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#0d3a42">
    식은땀, 손떨림, 과호흡의 자율신경 안정 원리
  </text>
  <text x="40" y="125" font-family="'Pretendard', sans-serif" font-size="13.5" font-weight="500" fill="#555555">
    위협이 없는 상황에서도 발동하는 투쟁-도피(Fight-or-Flight) 반응 억제
  </text>

  <!-- Left Box -->
  <rect x="40" y="150" width="345" height="225" rx="14" fill="#ffffff" stroke="#e05252" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="150" width="345" height="44" rx="14" fill="#fef2f2"/>
  <rect x="40" y="184" width="345" height="10" fill="#fef2f2"/>
  <text x="212" y="178" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#e05252">
    교감신경 폭주 반응
  </text>
  <g transform="translate(60, 222)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 땀샘 자극으로 식은땀 과다 분비</text><text x="0" y="38" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 혈압 급상승, 말초 근육 경련/떨림</text><text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 흉식 호흡으로 인한 과호흡 증후군</text>
  </g>

  <!-- Right Box -->
  <rect x="415" y="150" width="345" height="225" rx="14" fill="#ffffff" stroke="#1c6e78" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="415" y="150" width="345" height="44" rx="14" fill="#edf7f8"/>
  <rect x="415" y="184" width="345" height="10" fill="#edf7f8"/>
  <text x="587" y="178" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#1c6e78">
    신경 이완 및 호흡 재조정
  </text>
  <g transform="translate(435, 222)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 횡격막 복식호흡(4-7-8)으로 부교감 자극</text><text x="0" y="38" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 편도체 과각성을 낮추는 한약 처방</text><text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 감각 신경의 과민도 안정화 치료</text>
  </g>

  <!-- Bottom CTA / Watermark Bar -->
  <rect x="40" y="392" width="720" height="34" rx="17" fill="url(#headGrad)"/>
  <text x="400" y="414" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    🌿 자율신경 호흡 훈련 및 심신 안정 한방 클리닉 ｜ 마음까지 헤아리는 해아림
  </text>
</svg>