<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8f9"/>
      <stop offset="100%" stop-color="#e9f3f4"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d3a42"/>
      <stop offset="100%" stop-color="#1c6e78"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="20"/>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#badfe3" stroke-width="2" rx="19"/>

  <!-- Top Badge -->
  <rect x="40" y="32" width="220" height="30" rx="15" fill="#1c6e78"/>
  <text x="150" y="52" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    체온 조절 불균형
  </text>
  <text x="760" y="52" text-anchor="end" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#666666">
    해아림한의원 자율신경 클리닉 FAQ
  </text>

  <!-- Title and Subtitle -->
  <text x="40" y="98" font-family="'Pretendard', sans-serif" font-size="22" font-weight="800" fill="#0d3a42">
    상열하한(上熱下寒) ; 얼굴은 화끈, 손발은 얼음
  </text>
  <text x="40" y="125" font-family="'Pretendard', sans-serif" font-size="13.5" font-weight="500" fill="#555555">
    교감신경 말초혈관 수축과 흉부 기체(氣滯)로 인한 자율신경 체온 조절 장애
  </text>

  <!-- Left Box -->
  <rect x="40" y="150" width="345" height="225" rx="14" fill="#ffffff" stroke="#e05252" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="150" width="345" height="44" rx="14" fill="#fef2f2"/>
  <rect x="40" y="184" width="345" height="10" fill="#fef2f2"/>
  <text x="212" y="178" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#e05252">
    상열(上熱) 교감신경 과항진
  </text>
  <g transform="translate(60, 222)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 얼굴, 가슴으로 훅 오르는 열감</text><text x="0" y="38" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 두통, 눈 충혈, 가슴 답답함</text><text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 야간 수면 중 상충열 및 불면</text>
  </g>

  <!-- Right Box -->
  <rect x="415" y="150" width="345" height="225" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="415" y="150" width="345" height="44" rx="14" fill="#f0f9ff"/>
  <rect x="415" y="184" width="345" height="10" fill="#f0f9ff"/>
  <text x="587" y="178" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0284c7">
    하한(下寒) 말초 순환 저하
  </text>
  <g transform="translate(435, 222)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 손발 시림, 아랫배 차가움</text><text x="0" y="38" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 말초 미세혈관 수축 및 순환 장애</text><text x="0" y="76" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#333333" font-weight="500">• 수승화강(水升火降) 정상화 처방</text>
  </g>

  <!-- Bottom CTA / Watermark Bar -->
  <rect x="40" y="392" width="720" height="34" rx="17" fill="url(#headGrad)"/>
  <text x="400" y="414" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    🌿 자율신경 조절 한약과 온경회양(溫經回陽) 처방 ｜ 마음까지 헤아리는 해아림
  </text>
</svg>