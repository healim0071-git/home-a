# ══════════════════════════════════════════════════════════════════════════════
# HUGOBLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  seo:
    title: "해아림한의원"
    keywords: "자율신경실조증, 자율신경실조증한의원, 교감신경항진, 검사상 이상없는 두근거림, 내과 심장검사 정상 어지럼증, 응급실 정상판정 과호흡, 기립성어지럼증, 교감신경항진 불면증, 신경성 신체화증상, 담적병, 자율신경실조증 공황장애 차이점, 자율신경계 기능 검사 한의원, 자율신경실조증 치료 병원, 해아림한의원"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "해아림한의원 자율신경실조증 클리닉"
    organization: "해아림한의원 전국 15개 네트워크"
    type: local_business # person | organization | local_business
    tagline: "16여 년 임상 노하우와 정밀 진단 시스템"
    description: "두근거림, 가슴 답답함, 어지럼증, 불면증, 과호흡 등 자율신경계 이상 증상을 진료합니다. 검사상 이상없는 신체화 증상 치료 전문적인 치료병원을 찾는다면, 한방신경정신과 전문의, 박사 등의 해아림한의원 자율신경클리닉이 있습니다. 자율신경실조증과 공황장애 | 자율신경실조증과 불안장애 | 재발한 자율신경계 이상 증상"
    social:
      twitter: ""

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "#1c6e78"
      secondary: "#0d3a42"
      neutral: "#212121"

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "system"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "md" # none | sm | md | lg | full
    spacing: "spacious" # compact | comfortable | spacious
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar # navbar | navbar-simple | minimal
    sticky: true
    align: center # left | center | right
    search: false
    theme_toggle: true

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal # minimal | columns | centered

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} {name}"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
